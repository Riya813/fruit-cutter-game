<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fruit Cutter Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1b1629;
        overflow: hidden;
      }
      /* Full-viewport container; Phaser's autoCenter does the centering.
         (Flex + autoCenter margins stack and push the canvas off-center.) */
      #game {
        position: fixed;
        inset: 0;
      }
      canvas {
        touch-action: none;
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script src="https://krazic.com/assets/site.js" defer></script>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
